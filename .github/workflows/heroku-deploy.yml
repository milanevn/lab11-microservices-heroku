name: Deploy to Heroku

on:
  push:
    branches: [main]

jobs:
  deploy-user-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh
      - uses: akhileshns/heroku-deploy@v3.12.12
        with:
          heroku_api_key: ${{secrets.HEROKU_API_KEY}}
          heroku_app_name: "dothuy-user-service"
          heroku_email: "dothithanhthuy10ta1@gmail.com"
          appdir: "user-service"

  deploy-product-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh
      - uses: akhileshns/heroku-deploy@v3.12.12
        with:
          heroku_api_key: ${{secrets.HEROKU_API_KEY}}
          heroku_app_name: "dothuy-product-service"
          heroku_email: "dothithanhthuy10ta1@gmail.com"
          appdir: "product-service"

  deploy-order-service:
    runs-on: ubuntu-latest
    needs: [deploy-user-service, deploy-product-service]
    steps:
      - uses: actions/checkout@v4
      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh
      - uses: akhileshns/heroku-deploy@v3.12.12
        with:
          heroku_api_key: ${{secrets.HEROKU_API_KEY}}
          heroku_app_name: "dothuy-order-service"
          heroku_email: "dothithanhthuy10ta1@gmail.com"
          appdir: "order-service"

  deploy-api-gateway:
    runs-on: ubuntu-latest
    needs: [deploy-user-service, deploy-product-service, deploy-order-service]
    steps:
      - uses: actions/checkout@v4
      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh
      - uses: akhileshns/heroku-deploy@v3.12.12
        with:
          heroku_api_key: ${{secrets.HEROKU_API_KEY}}
          heroku_app_name: "dothuy-api-gateway"
          heroku_email: "dothithanhthuy10ta1@gmail.com"
          appdir: "api-gateway"
